services:
  bot:
    build: .
    image: apps-bot:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /data/bot.sqlite3
      PORT: "8080"
      IPA_DIR: /app/files
    volumes:
      # Именованный том, а не ./data: он наследует владельца от образа, и
      # непривилегированный пользователь контейнера может в него писать.
      # Бинд-монт с хоста Docker создаёт от root — бот тогда не откроет базу.
      - bot_data:/data
      # UI можно править без пересборки образа: правьте файлы и обновляйте страницу.
      - ./webapp:/app/webapp:ro
      # Сборки .ipa: кладутся на сервер отдельно от кода, пересборка не нужна.
      - ./files:/app/files:ro
    expose:
      - "8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5).status == 200 else 1)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Заглушка на время техработ: на любое сообщение отвечает, что идут
  # технические работы. Её запускает ./maintenance.sh on вместо бота — обычный
  # docker compose up её не трогает (профиль maintenance). Рядом с ботом её
  # не запускать: Telegram отдаёт апдейты только одному получателю.
  maintenance:
    image: apps-bot:latest
    profiles: ["maintenance"]
    restart: unless-stopped
    env_file: .env
    command: ["python", "-m", "app.maintenance"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - bot
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Страница техработ и флаг maintenance/on — папкой, а не файлом:
      # флаг появляется и пропадает, а смонтированная папка видит это сразу.
      - ./maintenance:/srv/maintenance:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  bot_data:
  caddy_data:
  caddy_config:
